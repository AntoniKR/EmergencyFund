<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подушка безопасности</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #edf1ec;
      --surface: #f8faf7;
      --ink: #1d2b27;
      --muted: #5b6a64;
      --rule: #c8d1cb;
      --stamp: #5a3d9a;
      --danger: #a3333d;
      --focus: #2f6fd1;
      --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #131a17;
        --surface: #1a221f;
        --ink: #e2e9e5;
        --muted: #9aa7a1;
        --rule: #2d3834;
        --stamp: #b9a5f2;
        --danger: #e8838b;
        --focus: #7aa7ff;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 var(--sans);
    }

    .page {
      max-width: 56rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(2rem, 5vw, 2.75rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin: 0 0 1.5rem;
    }

    h2 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.375rem;
      margin: 2.5rem 0 1rem;
    }

    /* Итог подушки: строка остатка, как в сберегательной книжке */
    .balance {
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.25rem 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--ink);
    }
    .balance-label { color: var(--muted); }
    .balance-value {
      font-family: var(--serif);
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-variant-numeric: tabular-nums lining-nums;
    }
    .balance-note {
      margin: 0.5rem 0 0;
      color: var(--muted);
    }

    /* Список вкладов: записи, разделённые линейками */
    .message {
      min-height: 1.5em;
      margin: 0 0 0.5rem;
      color: var(--muted);
    }
    .ledger { border-top: 1px solid var(--rule); }
    .empty {
      margin: 0;
      padding: 1.5rem 0;
      color: var(--muted);
      border-bottom: 1px solid var(--rule);
    }
    .entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem 1.5rem;
      padding: 1.1rem 0;
      border-bottom: 1px solid var(--rule);
    }
    .entry-name {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0;
      overflow-wrap: anywhere;
    }
    .entry-kind {
      margin: 0.15rem 0 0;
      color: var(--muted);
    }
    .entry-figures {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
      gap: 0.75rem 1.5rem;
      margin: 0;
    }
    .entry-figures dt {
      color: var(--muted);
      font-size: 0.875rem;
    }
    .entry-figures dd {
      margin: 0;
      font-variant-numeric: tabular-nums;
    }

    /* Прогноз к концу срока — «штамп» фиолетовыми банковскими чернилами */
    .stamp {
      display: inline-block;
      color: var(--stamp);
      border: 1.5px solid currentColor;
      border-radius: 4px;
      padding: 0.05em 0.45em;
      font-weight: 600;
      transform: rotate(-1.5deg);
    }

    .entry-delete {
      align-self: start;
      background: none;
      border: 1px solid var(--rule);
      border-radius: 6px;
      color: var(--danger);
      font: inherit;
      padding: 0.35rem 0.8rem;
      cursor: pointer;
    }
    .entry-delete:hover { border-color: var(--danger); }

    /* Форма */
    .form {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem 1.25rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .field-wide { grid-column: 1 / -1; }
    .field label { font-weight: 600; }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.875rem;
    }
    input, select {
      width: 100%;
      min-height: 2.5rem;
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.5rem 0.6rem;
    }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .form-errors {
      grid-column: 1 / -1;
      color: var(--danger);
      border-left: 3px solid var(--danger);
      padding: 0.25rem 0 0.25rem 0.75rem;
    }
    .form-errors ul {
      margin: 0;
      padding-left: 1.1rem;
    }
    .submit {
      grid-column: 1 / -1;
      justify-self: start;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 6px;
      padding: 0.65rem 1.4rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .submit:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    .footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.875rem;
    }

    @media (max-width: 40rem) {
      .form { grid-template-columns: 1fr; }
      .entry { grid-template-columns: 1fr; }
      .entry-delete { justify-self: start; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Подушка безопасности</h1>
      <p class="balance">
        <span class="balance-label">Сейчас на вкладах и счетах</span>
        <span class="balance-value" id="total">0,00 ₽</span>
      </p>
      <p class="balance-note" id="total-note"></p>
    </header>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Вклады и счета</h2>
      <p class="message" id="list-message" role="status" aria-live="polite"></p>
      <div class="ledger" id="ledger"></div>
    </section>

    <section aria-labelledby="form-title">
      <h2 id="form-title">Добавить вклад или счёт</h2>
      <form class="form" id="deposit-form" novalidate>
        <div class="field field-wide">
          <label for="field-name">Название</label>
          <input id="field-name" type="text" maxlength="50" autocomplete="off" placeholder="Например, вклад в Сбере">
        </div>

        <div class="field">
          <label for="field-type">Тип</label>
          <select id="field-type">
            <option value="deposit">Вклад со сроком</option>
            <option value="savingsAccount">Накопительный счёт</option>
          </select>
        </div>

        <div class="field">
          <label for="field-capitalization">Капитализация</label>
          <select id="field-capitalization">
            <option value="monthly">Ежемесячная</option>
            <option value="weekly">Еженедельная</option>
            <option value="daily">Ежедневная</option>
            <option value="none">Без капитализации</option>
          </select>
        </div>

        <div class="field">
          <label for="field-sum">Сумма, ₽</label>
          <input id="field-sum" type="number" min="0.01" step="0.01" inputmode="decimal">
        </div>

        <div class="field">
          <label for="field-rate">Ставка, % годовых</label>
          <input id="field-rate" type="number" min="0.01" max="100" step="0.01" inputmode="decimal">
          <p class="hint">Как в договоре с банком: 15 значит 15 %.</p>
        </div>

        <div class="field">
          <label for="field-start">Дата открытия</label>
          <input id="field-start" type="date">
        </div>

        <div class="field" id="term-field">
          <label for="field-term">Срок, месяцев</label>
          <input id="field-term" type="number" min="1" step="1" inputmode="numeric">
        </div>

        <div class="form-errors" id="form-errors" role="alert" hidden></div>

        <button class="submit" id="submit-button" type="submit">Добавить</button>
      </form>
    </section>

    <footer class="footer">
      <span id="api-status">Проверяю связь с сервером…</span>
    </footer>
  </main>

  <script>
    // Все адреса относительные: страница и API живут на одном origin, поэтому CORS не нужен.
    const API = '/api/deposits';

    const typeLabels = {
      deposit: 'Вклад',
      savingsAccount: 'Накопительный счёт'
    };

    const capitalizationLabels = {
      none: 'без капитализации',
      daily: 'ежедневная капитализация',
      weekly: 'еженедельная капитализация',
      monthly: 'ежемесячная капитализация'
    };

    const money = new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB' });
    const percent = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });

    const ledger = document.getElementById('ledger');
    const listMessage = document.getElementById('list-message');
    const total = document.getElementById('total');
    const totalNote = document.getElementById('total-note');

    const form = document.getElementById('deposit-form');
    const fields = {
      name: document.getElementById('field-name'),
      type: document.getElementById('field-type'),
      capitalization: document.getElementById('field-capitalization'),
      sum: document.getElementById('field-sum'),
      rate: document.getElementById('field-rate'),
      start: document.getElementById('field-start'),
      term: document.getElementById('field-term')
    };
    const termField = document.getElementById('term-field');
    const formErrors = document.getElementById('form-errors');
    const submitButton = document.getElementById('submit-button');

    // ---------- Форматирование ----------

    // API отдаёт дату строкой "YYYY-MM-DD". new Date("2026-11-03") считает её полуночью по UTC,
    // и западнее Гринвича дата съехала бы на день назад. Поэтому разбираем строку вручную.
    function formatDate(isoDate) {
      const [year, month, day] = isoDate.split('-');
      return `${day}.${month}.${year}`;
    }

    // Сегодня по местному времени в формате "YYYY-MM-DD".
    // toISOString() не подходит: он переводит в UTC, и в первые часы после полуночи по Москве вернёт вчера.
    function todayIso() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${now.getFullYear()}-${month}-${day}`;
    }

    // Русские окончания: 1 месяц, 2 месяца, 5 месяцев.
    function plural(count, forms) {
      const mod10 = count % 10;
      const mod100 = count % 100;
      if (mod10 === 1 && mod100 !== 11) {
        return forms[0];
      }
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) {
        return forms[1];
      }
      return forms[2];
    }

    // Создаёт элемент и кладёт текст через textContent, а не innerHTML.
    // Название вклада вводит пользователь: через innerHTML строка вида <img onerror=...> выполнилась бы как код (XSS).
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) {
        node.className = className;
      }
      if (text !== undefined) {
        node.textContent = text;
      }
      return node;
    }

    function showListMessage(text) {
      listMessage.textContent = text;
    }

    // ---------- Список ----------

    async function loadDeposits() {
      try {
        const response = await fetch(API);
        if (!response.ok) {
          showListMessage(`Список не загрузился: сервер ответил ${response.status}.`);
          return;
        }
        const deposits = await response.json();
        renderDeposits(deposits);
      } catch {
        showListMessage('Нет связи с сервером. Проверьте, что приложение запущено, и обновите страницу.');
      }
    }

    function renderDeposits(deposits) {
      ledger.replaceChildren();

      const totalSum = deposits.reduce((acc, deposit) => acc + deposit.sum, 0);
      total.textContent = money.format(totalSum);

      const depositCount = deposits.filter(d => d.type === 'deposit').length;
      const accountCount = deposits.length - depositCount;
      totalNote.textContent = deposits.length === 0
        ? ''
        : `${depositCount} ${plural(depositCount, ['вклад', 'вклада', 'вкладов'])} и ${accountCount} ${plural(accountCount, ['счёт', 'счёта', 'счетов'])}`;

      if (deposits.length === 0) {
        ledger.append(el('p', 'empty', 'Здесь появятся ваши вклады и счета. Добавьте первый через форму ниже.'));
        return;
      }

      // Порядок приходит с сервера: по дате открытия, при равенстве по id (так записано в контракте).
      for (const deposit of deposits) {
        ledger.append(createEntry(deposit));
      }
    }

    function createEntry(deposit) {
      const entry = el('article', 'entry');

      const head = el('div');
      head.append(el('h3', 'entry-name', deposit.name));
      const typeLabel = typeLabels[deposit.type] ?? deposit.type;
      const capitalizationLabel = capitalizationLabels[deposit.capitalization] ?? deposit.capitalization;
      head.append(el('p', 'entry-kind', `${typeLabel}, ${capitalizationLabel}`));

      const deleteButton = el('button', 'entry-delete', 'Удалить');
      deleteButton.type = 'button';
      deleteButton.setAttribute('aria-label', `Удалить «${deposit.name}»`);
      deleteButton.addEventListener('click', () => deleteDeposit(deposit));

      const figures = el('dl', 'entry-figures');
      addFigure(figures, 'Сумма', money.format(deposit.sum));
      addFigure(figures, 'Ставка', `${percent.format(deposit.interestRate)} % годовых`);
      addFigure(figures, 'Открыт', formatDate(deposit.startDate));

      if (deposit.term === null) {
        addFigure(figures, 'Срок', 'Без срока');
      } else {
        const months = `${deposit.term} ${plural(deposit.term, ['месяц', 'месяца', 'месяцев'])}`;
        addFigure(figures, 'Срок', `${months}, до ${formatDate(deposit.endDate)}`);
      }

      if (deposit.estimatedSum === null) {
        addFigure(figures, 'К концу срока', 'Не считается для счёта без срока');
      } else {
        addFigure(figures, 'К концу срока', el('span', 'stamp', money.format(deposit.estimatedSum)));
      }

      entry.append(head, deleteButton, figures);
      return entry;
    }

    function addFigure(list, label, value) {
      const wrapper = el('div');
      const term = el('dt', null, label);
      const description = el('dd');
      if (typeof value === 'string') {
        description.textContent = value;
      } else {
        description.append(value);
      }
      wrapper.append(term, description);
      list.append(wrapper);
    }

    async function deleteDeposit(deposit) {
      if (!confirm(`Удалить «${deposit.name}»?`)) {
        return;
      }
      try {
        const response = await fetch(`${API}/${deposit.id}`, { method: 'DELETE' });
        if (response.status === 204) {
          showListMessage(`Удалено: «${deposit.name}».`);
        } else if (response.status === 404) {
          showListMessage(`«${deposit.name}» уже удалён, список обновлён.`);
        } else {
          showListMessage(`Не удалось удалить: сервер ответил ${response.status}.`);
        }
        await loadDeposits();
      } catch {
        showListMessage('Нет связи с сервером. Ничего не удалено.');
      }
    }

    // ---------- Форма ----------

    function updateTermVisibility() {
      termField.hidden = fields.type.value !== 'deposit';
    }

    function resetFormDefaults() {
      const today = todayIso();
      fields.start.value = today;
      fields.start.max = today;
      fields.type.value = 'deposit';
      fields.capitalization.value = 'monthly';
      updateTermVisibility();
    }

    // Собирает тело запроса строго по контракту: те же имена полей, перечисления строками, term = null у счёта.
    function readForm() {
      const type = fields.type.value;
      return {
        name: fields.name.value.trim(),
        type: type,
        sum: fields.sum.valueAsNumber,
        interestRate: fields.rate.valueAsNumber,
        startDate: fields.start.value,
        term: type === 'deposit' ? fields.term.valueAsNumber : null,
        capitalization: fields.capitalization.value
      };
    }

    // Те же правила, что в контракте. Это удобство для пользователя, а не защита:
    // запрос можно отправить в обход страницы, поэтому сервер обязан проверять всё сам.
    function validate(data) {
      const errors = [];
      if (data.name.length === 0) {
        errors.push('Укажите название.');
      }
      if (!(data.sum > 0)) {
        errors.push('Сумма должна быть больше нуля.');
      }
      if (!(data.interestRate > 0 && data.interestRate <= 100)) {
        errors.push('Ставка должна быть больше 0 и не больше 100 %.');
      }
      if (!data.startDate) {
        errors.push('Укажите дату открытия.');
      } else if (data.startDate > todayIso()) {
        errors.push('Дата открытия не может быть в будущем.');
      }
      if (data.type === 'deposit' && !(Number.isInteger(data.term) && data.term > 0)) {
        errors.push('Для вклада укажите срок: целое число месяцев больше нуля.');
      }
      return errors;
    }

    function showFormErrors(messages) {
      formErrors.replaceChildren();
      if (messages.length === 0) {
        formErrors.hidden = true;
        return;
      }
      const list = el('ul');
      for (const message of messages) {
        list.append(el('li', null, message));
      }
      formErrors.append(list);
      formErrors.hidden = false;
    }

    // На 400 ASP.NET Core отвечает ProblemDetails: { title, errors: { "Поле": ["сообщение"] } }.
    async function readProblemMessages(response) {
      try {
        const problem = await response.json();
        if (problem.errors) {
          return Object.values(problem.errors).flat();
        }
        if (problem.title) {
          return [problem.title];
        }
      } catch {
        // тело не JSON — покажем общее сообщение
      }
      return [];
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const data = readForm();
      const errors = validate(data);
      if (errors.length > 0) {
        showFormErrors(errors);
        return;
      }
      showFormErrors([]);

      submitButton.disabled = true;
      try {
        const response = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (response.status === 201) {
          const created = await response.json();
          form.reset();
          resetFormDefaults();
          showListMessage(`Добавлено: «${created.name}».`);
          await loadDeposits();
        } else if (response.status === 400) {
          const messages = await readProblemMessages(response);
          showFormErrors(messages.length > 0 ? messages : ['Сервер отклонил данные. Проверьте поля формы.']);
        } else {
          showFormErrors([`Не удалось сохранить: сервер ответил ${response.status}.`]);
        }
      } catch {
        showFormErrors(['Нет связи с сервером. Данные не сохранены.']);
      } finally {
        submitButton.disabled = false;
      }
    });

    fields.type.addEventListener('change', updateTermVisibility);

    // ---------- Проверка связи ----------

    async function checkHealth() {
      const status = document.getElementById('api-status');
      try {
        const response = await fetch('/api/health');
        const data = await response.json();
        status.textContent = data.status === 'ok' ? 'Сервер на связи.' : 'Сервер ответил, но статус не «ok».';
      } catch {
        status.textContent = 'Сервер не отвечает.';
      }
    }

    resetFormDefaults();
    loadDeposits();
    checkHealth();
  </script>
</body>
</html>
