<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вклады — Подушка безопасности</title>
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/deposits.js" defer></script>
</head>
<body>
  <main class="page">
    <header>
      <h1>Подушка безопасности</h1>
      <nav class="nav" aria-label="Разделы">
        <a href="/" aria-current="page">Вклады</a>
        <a href="/goal.html">Цель</a>
      </nav>
      <p class="balance">
        <span class="balance-label">Сейчас на вкладах и счетах</span>
        <span class="balance-value" id="total">0,00 ₽</span>
      </p>
      <p class="balance-note" id="total-note"></p>
    </header>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Вклады и счета</h2>
      <p class="message" id="list-message" role="status" aria-live="polite"></p>
      <div class="ledger" id="ledger"></div>
    </section>

    <section aria-labelledby="form-title">
      <h2 id="form-title">Добавить вклад или счёт</h2>
      <form class="form" id="deposit-form" novalidate>
        <div class="field field-wide">
          <label for="field-name">Название</label>
          <input id="field-name" type="text" maxlength="50" autocomplete="off" placeholder="Например, вклад в Сбере">
        </div>

        <div class="field">
          <label for="field-type">Тип</label>
          <select id="field-type">
            <option value="deposit">Вклад со сроком</option>
            <option value="savingsAccount">Накопительный счёт</option>
          </select>
        </div>

        <div class="field">
          <label for="field-capitalization">Капитализация</label>
          <select id="field-capitalization">
            <option value="monthly">Ежемесячная</option>
            <option value="weekly">Еженедельная</option>
            <option value="daily">Ежедневная</option>
            <option value="none">Без капитализации</option>
          </select>
        </div>

        <div class="field">
          <label for="field-sum">Сумма, ₽</label>
          <input id="field-sum" type="number" min="0.01" step="0.01" inputmode="decimal">
        </div>

        <div class="field">
          <label for="field-rate">Ставка, % годовых</label>
          <input id="field-rate" type="number" min="0.01" max="100" step="0.01" inputmode="decimal">
          <p class="hint">Как в договоре с банком: 15 значит 15 %.</p>
        </div>

        <div class="field">
          <label for="field-start">Дата открытия</label>
          <input id="field-start" type="date">
        </div>

        <div class="field" id="term-field">
          <label for="field-term">Срок, месяцев</label>
          <input id="field-term" type="number" min="1" step="1" inputmode="numeric">
        </div>

        <div class="form-errors" id="form-errors" role="alert" hidden></div>

        <div class="form-actions">
          <button class="submit" id="submit-button" type="submit">Добавить</button>
        </div>
      </form>
    </section>

    <footer class="footer">
      <span id="api-status">Проверяю связь с сервером…</span>
    </footer>
  </main>
</body>
</html>
