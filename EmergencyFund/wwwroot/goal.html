<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Цель — Подушка безопасности</title>
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/goal.js" defer></script>
</head>
<body>
  <main class="page">
    <header>
      <h1>Подушка безопасности</h1>
      <nav class="nav" aria-label="Разделы">
        <a href="/">Вклады</a>
        <a href="/goal.html" aria-current="page">Цель</a>
      </nav>
    </header>

    <section aria-labelledby="goal-title">
      <h2 id="goal-title">Сколько уже собрано</h2>
      <div class="goal-summary" id="goal-summary" aria-live="polite"></div>
    </section>

    <section aria-labelledby="goal-form-title">
      <h2 id="goal-form-title">Параметры цели</h2>
      <form class="form form-three" id="goal-form" novalidate>
        <div class="field">
          <label for="goal-expenses">Расходы в месяц, ₽</label>
          <input id="goal-expenses" type="number" min="0.01" step="0.01" inputmode="decimal">
        </div>
        <div class="field">
          <label for="goal-months">Запас на сколько месяцев</label>
          <input id="goal-months" type="number" min="1" step="1" inputmode="numeric">
        </div>
        <div class="field">
          <label for="goal-savings">Откладываю в месяц, ₽</label>
          <input id="goal-savings" type="number" min="0" step="0.01" inputmode="decimal">
          <p class="hint">Можно 0, если сейчас не откладываете.</p>
        </div>

        <div class="form-errors" id="goal-errors" role="alert" hidden></div>

        <div class="form-actions">
          <button class="submit" id="goal-submit" type="submit">Задать цель</button>
          <button class="button-danger" id="goal-delete" type="button" hidden>Удалить цель</button>
        </div>
      </form>
    </section>

    <footer class="footer">
      <span id="api-status">Проверяю связь с сервером…</span>
    </footer>
  </main>
</body>
</html>
